name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Select Git Bash and check Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $gitExe -Parent) -Parent
          $bashDir = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $bashDir 'bash.exe'))) {
            throw 'Git for Windows Bash is required.'
          }
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $wsh = New-Object -ComObject WScript.Shell; [void][Runtime.InteropServices.Marshal]::ReleaseComObject($wsh)'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell and WScript.Shell are required.' }
          & $env:ComSpec /d /v:off /c ver
          if ($LASTEXITCODE -ne 0) { throw 'Windows CMD is required.' }

      - name: Check Bash prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PYTHON'
          import shutil
          import subprocess
          bash = shutil.which('bash')
          if not bash:
              raise SystemExit('Bash is required.')
          print(bash, flush=True)
          subprocess.run([bash, '--noprofile', '--norc', '-c',
                          'set -eu; for tool in mktemp date cp curl chmod mv rm; do command -v "$tool"; done'],
                         check=True)
          PYTHON

      - name: Run regression tests
        run: python -X utf8 -B -m unittest discover -s tests -v
